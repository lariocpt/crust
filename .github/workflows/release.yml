name: Release

# Tag-driven: `git tag v0.2.0 && git push origin v0.2.0` publishes both public channels.
# The release commit also bumps the root package.json to the version: this workflow
# stamps from the tag and never reads the in-repo value, but the LAN Jenkins plane
# derives its BASE from it, so a release commit that skips the bump mislabels
# every LAN build.
#
# ORDER IS LOAD-BEARING. The binaries must exist as release assets BEFORE the npm package is
# published, because the npm package is a ~4 KB launcher that resolves its binary from the
# release matching its own version. Publishing npm first ships a package that cannot install
# itself — the same invariant the LAN Jenkins pipeline keeps between /srv/apps and Verdaccio.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v0.2.0"
        required: true

permissions:
  contents: write
  # Publishing the staged launcher to npm.pkg.github.com (what the repo's
  # Packages tab mirrors) needs this on the default GITHUB_TOKEN.
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: a Bun regression in --compile --bytecode cross-compilation would
          # otherwise silently break every future release. CI stays on latest as the
          # canary that tells us when it is safe to move this.
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test
      - run: bunx tsc --noEmit

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: a Bun regression in --compile --bytecode cross-compilation would
          # otherwise silently break every future release. CI stays on latest as the
          # canary that tells us when it is safe to move this.
          bun-version: "1.3.14"

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # A tag that isn't a plain semver would publish a version nobody can resolve back to
          # a release, so reject it here rather than after 90 MB of uploads.
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "FAIL: tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # src/index.ts imports ../package.json for --version and --build-info, so the manifest
      # is stamped before the compile — otherwise every released binary reports the in-repo
      # `-dev` version and the "dev" commit. The commit is the one the checkout actually
      # resolved: HEAD after a tag-ref checkout is the tagged commit itself, which is what
      # the binaries were compiled from and what `git diff vA..vB` compares against.
      - name: Stamp version and commit
        id: stamp
        run: |
          set -euo pipefail
          sed -i '0,/"version"/s|"version"[[:space:]]*:[[:space:]]*"[^"]*"|"version": "${{ steps.version.outputs.version }}"|' package.json
          grep -m1 '"version"' package.json
          COMMIT=$(git rev-parse HEAD)
          sed -i '0,/"gitCommit"/s|"gitCommit"[[:space:]]*:[[:space:]]*"[^"]*"|"gitCommit": "'"$COMMIT"'"|' package.json
          grep -m1 '"gitCommit"' package.json
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p out
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            echo "==> crust-$target"
            # The asset basename becomes the command name after install.sh moves it into place,
            # so the platform suffix is stripped at install time, not here.
            bun build --compile --minify --bytecode --target="bun-$target" \
              --outfile "out/crust-$target" src/index.ts
            # The mongo variant: same source tree, driver statically bundled (build-time
            # resolution is the ONLY path that works in a compiled binary — measured
            # 2026-11-12). mongodb is a devDependency; the clean bundle above never
            # references it, so the clean binary stays zero-dependency.
            echo "==> crust-$target-mongo"
            bun build --compile --minify --bytecode --target="bun-$target" \
              --outfile "out/crust-$target-mongo" src/index-mongo.ts
          done
          chmod 0755 out/crust-*
          ls -lh out/

      # Only the runner's own architecture can be executed here, but that is enough to catch
      # the failure that actually happens: a binary built from an unstamped manifest.
      - name: Verify stamped version and commit
        run: |
          set -euo pipefail
          got=$(./out/crust-linux-x64 --version | tr -d '\r')
          echo "reported version: $got"
          [ "$got" = "crust ${{ steps.version.outputs.version }}" ] \
            || { echo "FAIL: binary reports '$got', expected 'crust ${{ steps.version.outputs.version }}'"; exit 1; }
          # The commit is the provenance: a docs-only release is provable only if the stamped
          # commit actually made it into the binary, so read it back out via --build-info.
          gotCommit=$(./out/crust-linux-x64 --build-info | jq -r '.gitCommit')
          echo "reported commit: $gotCommit"
          [ "$gotCommit" = "${{ steps.stamp.outputs.commit }}" ] \
            || { echo "FAIL: binary reports commit '$gotCommit', expected '${{ steps.stamp.outputs.commit }}'"; exit 1; }

      # The variant contract, end to end through real compiled binaries — this is the
      # ONLY place the /$bunfs/ code path can be exercised (source mode never hits it):
      # the clean binary must redirect to the mongo package, the mongo binary must
      # carry the driver (so it fails on the connection, never on the redirect).
      - name: Verify mongo variants
        run: |
          set -euo pipefail
          export MONGODB_URI="mongodb://127.0.0.1:1/x" CRUST_CONFIG=/dev/null
          clean=$(./out/crust-linux-x64 -c 'mongo "db.x.find({})"' 2>&1 || true)
          echo "$clean" | grep -q "@lariocpt/crust-mongo" \
            || { echo "FAIL: clean binary did not redirect to the mongo variant: $clean"; exit 1; }
          bundled=$(./out/crust-linux-x64-mongo -c 'mongo "db.x.find({})"' 2>&1 || true)
          echo "$bundled" | grep -q "@lariocpt/crust-mongo" \
            && { echo "FAIL: mongo binary is missing its bundled driver: $bundled"; exit 1; }
          ./out/crust-linux-x64-mongo --version | grep -q "crust ${{ steps.version.outputs.version }}" \
            || { echo "FAIL: mongo binary reports an unstamped version"; exit 1; }

      # sha256sum's own format, so `sha256sum -c SHA256SUMS` works for anyone who downloads
      # the whole set — and both installers parse the same file.
      - name: Checksums
        run: |
          set -euo pipefail
          cd out && sha256sum crust-* > SHA256SUMS && cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # Idempotent so a failed npm job can be re-run without hand-deleting the release.
          # A prerelease must not become "latest": install.sh's default resolves
          # releases/latest/download, so an rc tag would ship to everyone.
          PRE=""
          case "${{ steps.version.outputs.version }}" in
            *-*) PRE="--prerelease" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/crust-* out/SHA256SUMS --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" out/crust-* out/SHA256SUMS \
              --title "crust $TAG" \
              --generate-notes $PRE
          fi

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "FAIL: repository secret NPM_TOKEN is not set."
            echo "Create a granular npmjs.org token with publish rights to @lariocpt/crust, then:"
            echo "  gh secret set NPM_TOKEN -R ${{ github.repository }}"
            echo "The binaries are already released — re-run this job once the secret exists."
            exit 1
          fi

      # The published package is the launcher in npm/, not this repo: staged, stamped, and
      # pointed at the GitHub Releases plane. The in-repo npm/package.json keeps its LAN
      # defaults (name `crust`, source `apps`) so the Jenkins pipeline is unaffected.
      - name: Stage package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf npmstage && cp -r npm npmstage
          # Agent skills ride along in the tarball (package.json "files" lists skills/).
          cp -r skills npmstage/skills
          jq --arg v "$VERSION" --arg repo "${{ github.repository }}" '
            .name = "@lariocpt/crust"
            | .version = $v
            | .crust.source = "github"
            | .crust.repo = $repo
            | .os = ["linux", "darwin"]
            | .cpu = ["x64", "arm64"]
            | del(.publishConfig)
          ' npm/package.json > npmstage/package.json
          cat npmstage/package.json

      # The mongo launcher is the SAME launcher code with two manifest differences:
      # the package name, and crust.variant=mongo, which makes it resolve the
      # crust-<platform>-<arch>-mongo asset. One bin name (`crust`) in both packages:
      # they are alternatives, not additions — installing both globally conflicts by design.
      - name: Stage mongo package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf npmstage-mongo && cp -r npm npmstage-mongo
          cp -r skills npmstage-mongo/skills
          jq --arg v "$VERSION" --arg repo "${{ github.repository }}" '
            .name = "@lariocpt/crust-mongo"
            | .version = $v
            | .description = "crust with the MongoDB driver bundled — the mongo variant of the crust binary launcher"
            | .crust.source = "github"
            | .crust.repo = $repo
            | .crust.variant = "mongo"
            | .keywords = ((.keywords // []) + ["mongo", "mongodb"])
            | .os = ["linux", "darwin"]
            | .cpu = ["x64", "arm64"]
            | del(.publishConfig)
          ' npm/package.json > npmstage-mongo/package.json
          cat npmstage-mongo/package.json

      - name: Publish to npmjs.org
        working-directory: npmstage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          # npm cannot republish a version, and the workflow_dispatch input
          # exists to re-release a tag after a failed step — so a version an
          # earlier run already shipped is a skip with a notice, not a
          # failure. The binary-before-launcher invariant still holds: the
          # release job created the matching GitHub Release before either
          # publish ran.
          if npm view "@lariocpt/crust@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@lariocpt/crust@$VERSION is already on npmjs.org — skipping"
          else
            npm publish --access public
          fi

      - name: Publish mongo package to npmjs.org
        working-directory: npmstage-mongo
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@lariocpt/crust-mongo@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@lariocpt/crust-mongo@$VERSION is already on npmjs.org — skipping"
          else
            npm publish --access public
          fi

      # The repo's Packages tab only mirrors npm.pkg.github.com — the npmjs
      # publish above never shows up there. Same staged package, second
      # registry: the launcher already points at the GitHub Releases plane
      # (crust.source=github), so the binary-before-launcher invariant is
      # unchanged. The token is bound to the host in the user npmrc, which
      # the fresh runner keeps only for this job.
      - name: Publish to GitHub Packages
        working-directory: npmstage
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --registry https://npm.pkg.github.com

      - name: Publish mongo package to GitHub Packages
        working-directory: npmstage-mongo
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --registry https://npm.pkg.github.com

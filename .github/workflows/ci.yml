name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR makes the first run's result irrelevant, so don't burn a runner on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --ignore-scripts: nothing in the dependency tree needs a postinstall to build or test,
      # and CI is exactly where an unreviewed one should not run.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit

      # `bun run check`, not `bunx biome check`: bunx resolves the latest biome,
      # which drifts from the version biome.json's $schema targets and fails the
      # config parse. The script uses the lockfile-pinned binary.
      - name: Lint
        run: bun run check

  # The site package is the first piece of this repo that must pass on Windows
  # (it runs under plain Bun; the compiled crust binary stays linux/darwin).
  # fail-fast is off: a Windows runner flake (AV locking during file swaps)
  # must not cancel the linux leg mid-run.
  site-test:
    name: site package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Same install hygiene as the main job; the workspaces field makes this
      # also resolve packages/site's dependencies (markdown-it, yaml).
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # working-directory, not `cd`: shell-independent on the Windows runner.
      # Typecheck is load-bearing here — the root tsc only covers src/tests/skel,
      # so without this step nothing in CI ever type-checks packages/site.
      - name: Typecheck
        working-directory: packages/site
        run: bun run typecheck

      - name: Test
        working-directory: packages/site
        run: bun test
